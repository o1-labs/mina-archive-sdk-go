name: Release

# Go modules are served directly from the git tag — no registry push needed.
# This workflow just creates a GitHub release with auto-generated notes when
# a `v*` tag is pushed, so the release page mirrors the proxy.golang.org
# import surface.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./...
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
