name: Schema Drift

on:
  schedule:
    - cron: '0 13 * * 1'  # Mondays 13:00 UTC
  # Deliberately unfiltered, so the README's "weekly and on PR" is true. The
  # path filter that used to be here meant a PR editing types.go or queries.go
  # without touching schema.graphql was never drift-checked — exactly the PR
  # that could desynchronise the models from the schema.
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare schema against upstream
        run: bash scripts/check_schema_drift.sh
